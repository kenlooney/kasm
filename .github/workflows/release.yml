name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require commit to be on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to release: $GITHUB_SHA is not part of main." >&2
            exit 1
          fi

      - name: Read release version
        id: metadata
        shell: bash
        run: |
          version="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' CMakeLists.txt)"
          if [[ -z "$version" ]]; then
            echo "Could not read the project version from CMakeLists.txt." >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Preparing release v${version}"

  package:
    name: Package for ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_TESTING=OFF
          -DCMAKE_BUILD_TYPE=Release
          "-DKASM_RELEASE_TAG:STRING=${{ needs.prepare.outputs.tag }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: build/packages/kasm-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - name: Create release and version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG" packages/*.zip
          --target "$GITHUB_SHA"
          --generate-notes

      - name: Retain only the newest 3 stable releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_LIMIT: 3
        shell: bash
        run: |
          expired_tags="$(
            gh api --paginate \
              "repos/{owner}/{repo}/releases?per_page=100" \
              | jq -r -s --argjson limit "$RELEASE_LIMIT" '
                  add
                  | map(select(
                      .draft == false
                      and .prerelease == false
                      and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
                    ))
                  | sort_by(.created_at)
                  | reverse
                  | .[$limit:]
                  | .[].tag_name'
          )"

          if [[ -n "$expired_tags" ]]; then
            while IFS= read -r tag; do
              echo "Deleting expired stable release $tag"
              gh release delete "$tag" --cleanup-tag --yes
            done <<< "$expired_tags"
          fi

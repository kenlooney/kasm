[book]
title = "Kasm Dev Log: From 0.0.0 to 0.37.0"
description = "A running development journal of Kasm, a small C x86-64/x86-16 assembler, told version by version."
authors = ["Ken Looney"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/kenlooney/kasm"
edit-url-template = "https://github.com/kenlooney/kasm/edit/main/devlog/{path}"
